      background: #0f766e; border: 0; border-radius: 8px; cursor: pointer;

      var STORAGE_KEY = 'nsj_access_key';

      var fromB64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
      var toB64 = function (buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); };

      function deriveKey(password) {
        return crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey'])
          .then(function (baseKey) {
            return crypto.subtle.deriveKey(
              { name: 'PBKDF2', salt: fromB64(PAYLOAD.salt), iterations: PAYLOAD.iterations, hash: 'SHA-256' },
              baseKey, { name: 'AES-GCM', length: 256 }, true, ['decrypt']
            );
          });
      }

      function decrypt(key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(PAYLOAD.iv) }, key, fromB64(PAYLOAD.data))
          .then(function (plain) { return new TextDecoder().decode(plain); });
      }

      // Reemplazar el documento solo cuando terminó de cargar; si el parser sigue
      // activo, document.open() no limpia la página y el HTML se mezcla.
      function render(html) {
        if (document.readyState !== 'complete') {
          return window.addEventListener('load', function () { render(html); }, { once: true });
        }
        document.open();
        document.write(html);
        document.close();

        // Los navegadores no vuelven a disparar 'load' en window tras document.open()
        // en una página ya cargada; lo disparamos para que corra el window.onload de la app.
        var loaded = false;
        window.addEventListener('load', function () { loaded = true; });
        function fireLoad() {
          if (!loaded) window.dispatchEvent(new Event('load'));
        }
        if (document.readyState === 'complete') {
          setTimeout(fireLoad);
        } else {
          document.addEventListener('readystatechange', function () {
            if (document.readyState === 'complete') setTimeout(fireLoad);
          });
        }
      }

      var form = document.getElementById('login');
      var input = document.getElementById('password');
      var button = document.getElementById('submit');
      var error = document.getElementById('error');

      function showLogin() {
        form.classList.remove('hidden');
        input.focus();
      }

      // ?salir borra la clave guardada en este dispositivo
      if (/[?&]salir\b/.test(location.search)) {
        localStorage.removeItem(STORAGE_KEY);
        history.replaceState(null, '', location.pathname);
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        error.textContent = '';
        button.disabled = true;
        button.textContent = 'Verificando…';
        var key;
        deriveKey(input.value)
          .then(function (k) { key = k; return decrypt(k); })
          .then(function (html) {
            return crypto.subtle.exportKey('raw', key).then(function (raw) {
              localStorage.setItem(STORAGE_KEY, toB64(raw));
              render(html);
            });
          })
          .catch(function () {
            error.textContent = 'Contraseña incorrecta.';
            button.disabled = false;
            button.textContent = 'Entrar';
            input.select();
          });
      });

      var saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return showLogin();

      crypto.subtle.importKey('raw', fromB64(saved), 'AES-GCM', false, ['decrypt'])
        .then(decrypt)
        .then(render)
        .catch(function () {
          // La contraseña cambió o la clave guardada no es válida
          localStorage.removeItem(STORAGE_KEY);
          showLogin();
        });
    })();
